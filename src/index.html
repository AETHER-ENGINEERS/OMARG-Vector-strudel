<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Strudel XDC</title>
  <script src="webxdc.js"></script>
  <script src="vendor/strudel-web.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="mark">∿</div>
    <div>
      <h1>Strudel XDC</h1>
      <p id="status">solo · tap play to arm audio</p>
    </div>
    <div class="who" id="who"></div>
  </header>

  <div class="editor-wrap">
    <pre id="codehi" class="code-hi" aria-hidden="true"></pre>
    <textarea id="code" spellcheck="false" autocomplete="off" autocorrect="off">setcpm(140/4)

// A minor. Every pitch is in the scale — swap a/c/e/g and it still sings.
// Sliders: kick, hats, growl, lead, keys.
// Tap Play once. Ctrl/Cmd+Enter sends to the room. Ctrl/Cmd+. stops.

$: s("bd*4").gain(slider(0.9, 0, 1))
$: s("~ sd ~ sd").gain(0.52)
$: s("hh*16").gain(slider(0.2, 0, 1))
$: s("~ ~ oh ~").gain(0.28)

$: note("[a1 a1] [a1 c2] [a1 a1] [g1 a1]")
  .s("sawtooth")
  .lpf(slider(340, 80, 2000))
  .lpq(6)
  .gain(0.48)

$: note("<a3 c4 e4 g4 a4 g4 e4 c4>/2")
  .s("supersaw")
  .lpf(slider(1600, 400, 4800))
  .room(0.35)
  .gain(0.26)

$: note("<a3 ~ e4 c4 ~ g4 e4 a4>")
  .s("piano")
  .room(0.5)
  .gain(slider(0.4, 0, 1))</textarea>
  </div>

  <div id="sliders" class="sliders" hidden></div>
  <p id="err" class="err" hidden></p>

  <div class="bar">
    <button id="play">Play</button>
    <button id="stop" disabled>Stop</button>
    <button id="eval">Eval to room</button>
    <label class="live"><input id="live" type="checkbox" checked /> live</label>
    <label class="filebtn ghost">Import pack<input id="importfile" type="file" multiple accept="audio/*,.wav,.mp3,.ogg,.oga,.opus,.flac,.m4a,.zip" /></label>
    <button id="importchat" class="ghost" hidden>From chat</button>
    <button id="clearbank" class="ghost">Clear bank</button>
    <label class="cps">cpm <input id="cpm" type="number" value="33" min="1" max="400" /></label>
  </div>

  <section id="bank" class="bank">
    <h2>Local bank</h2>
    <p id="bankmeta">loading starter kit…</p>
    <ul id="banklist"></ul>
  </section>

  <pre id="log"></pre>
  <script src="starter-pack-1.js"></script>
  <script src="starter-pack-2.js"></script>
  <script src="starter-pack-3.js"></script>
  <script src="starter-pack-4.js"></script>
  <script src="stock-pack.js"></script>
  <script src="samples.js"></script>
  <script src="app.js"></script>
</body>
</html>
